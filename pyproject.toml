[project]
name = "decoupling"
version = "0.0.9"
description = "Decoupling multivariate functions using tensor decompositions, in Jax."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.9.0.1",
    "jaxtyping>=0.3.9",
    "beartype>=0.22.9",
    "tqdm>=4.67.3",
    "bsplx>=0.2.0",
]

authors = [{ name = "Maxime Rochkoulets", email = "mrochkoulets@gmail.com" }]

[project.urls]
Homepage = "https://github.com/mrochk/decoupling"
Repository = "https://github.com/mrochk/decoupling"
Issues = "https://github.com/mrochk/decoupling/issues"

[project.optional-dependencies]
examples = [
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "notebook>=7.6.2",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["decoupling*"]

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
decoupling = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
