[project]
name = "decoupling"
version = "0.0.9"
requires-python = ">=3.12"
description = "Fast tensor decoupling library in Jax."
authors = [{name="Maxime Rochkoulets", email="mrochkoulets@gmail.com"}]
readme = "README.md"
dependencies = [
    "jax>=0.9.0.1",
    "jaxtyping>=0.3.9",
    "beartype>=0.22.9",
    "tqdm>=4.67.3",
    "bsplx>=0.2.0",
]

[project.optional-dependencies]
examples = [
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "notebook>=7.6.2",
    "seaborn>=0.13.2",
]

[project.urls]
Homepage = "https://github.com/mrochk/decoupling"
Repository = "https://github.com/mrochk/decoupling"
Issues = "https://github.com/mrochk/decoupling/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.packages.find]
where = ["."]
include = ["decoupling*"]

[tool.uv.workspace]
members = ["."]

[tool.uv.sources]
decoupling = {workspace=true}

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

